name: Matchday Refresh

# Automatically refreshes the dashboard's match data every matchday by running
# the deterministic ESPN collector. No manual research required.
#
# Runs twice daily (UTC) to catch both the day's games and late kickoffs that
# fall into the next UTC date; also runnable on demand from the Actions tab.

on:
  schedule:
    - cron: "0 13 * * *"   # 07:00 America/Edmonton (MDT) — morning refresh
    - cron: "0 5 * * *"    # 23:00 America/Edmonton — catch late/finished games
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: matchday-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # secrets can't be used directly in `if:`; expose presence via env instead.
    env:
      HAS_GCP: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: pip install requests google-cloud-aiplatform

      - name: Collect today's (and yesterday's) matchday data from ESPN
        run: |
          python -m src.pipeline.collect_espn_matchday --date "$(date -u +%Y%m%d)" --write
          python -m src.pipeline.collect_espn_matchday --date "$(date -u -d 'yesterday' +%Y%m%d)" --write || true

      - name: Refresh top scorers from ESPN
        run: python -m src.pipeline.update_top_scorers --write || true

      - name: Refresh group standings and bracket from ESPN
        run: python -m src.pipeline.update_standings --write || true

      - name: Refresh squad average ages from ESPN
        run: python -m src.pipeline.update_team_ages --write || true

      # Team xG has no free no-browser source, so this drives a real browser.
      # Tolerant of failure (e.g. if FotMob blocks the runner IP) so it never
      # breaks the rest of the refresh; xG just keeps its last committed values.
      - name: Refresh team xG from FotMob (headless browser)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m src.pipeline.update_team_xg --write || true

      # Generate AI tactical headlines with Vertex AI Gemini. Skipped unless the
      # GCP_SA_KEY repository secret is set.
      - name: Authenticate to Google Cloud
        if: ${{ env.HAS_GCP == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Generate AI tactical headlines (optional)
        if: ${{ env.HAS_GCP == 'true' }}
        run: python -m src.pipeline.generate_match_headlines --date "$(date -u +%Y%m%d)" --write || true

      - name: Commit and push if data changed
        run: |
          git config user.name "matchday-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Matchday refresh $(date -u +%F)"
            git push
          fi

      # Optional auto-deploy to Cloud Run after a successful data refresh.
      # Enable by adding repository secrets GCP_SA_KEY (service-account JSON) and
      # GCP_PROJECT. Without them, this step is skipped and the refreshed data
      # deploys on the next build (e.g. a Cloud Build push trigger).
      - name: Deploy to Cloud Run (optional)
        if: ${{ env.HAS_GCP == 'true' }}
        run: echo "Configure GCP_SA_KEY + GCP_PROJECT secrets to enable auto-deploy."
